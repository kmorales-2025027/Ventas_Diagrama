<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Regístrate</h1>
    <p class="subtitulo">Ingrese nuevas credenciales</p>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/register}" th:object="${usuario}" method="post">
        <div class="campo">
            <label for="username">Nombre de Usuario</label>
            <input type="text" id="username" th:field="*{username}" placeholder="Ingrese su usuario" required>
            <div class="error"
                 th:if="${#fields.hasErrors('username')}"
                 th:errors="*{username}"></div>
        </div>

        <div class="campo">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" placeholder="Ingrese su correo" required>
            <div class="error"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}"></div>
        </div>

        <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" th:field="*{password}" placeholder="Ingrese su contraseña" required>
            <div class="error"
                 th:if="${#fields.hasErrors('password')}"
                 th:errors="*{password}"></div>
        </div>

        <input type="hidden" name="rol" value="USER">

        <input type="hidden" name="estado" value="true">

        <div class="acciones">
            <button type="submit" class="btn">Registrarse</button>

            <a class="btn-secundario" th:href="@{/login}">Iniciar Sesión</a>
        </div>
    </form>
</div>
</body>
</html>
