<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modoEdicion} ? 'Editar Producto' : 'Nuevo Producto'"></title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1 th:text="${modoEdicion} ? 'Editar Producto' : 'Nuevo Producto'"></h1>

    <form th:action="${modoEdicion} ? @{/producto/actualizar/{id}(id=${producto.codigoProducto})} : @{/producto/guardar}"
          th:object="${producto}"
          method="post">

        <div class="campo">
            <label for="nombreProducto">Nombre</label>
            <input type="text" id="nombreProducto" th:field="*{nombreProducto}" required>
            <div class="error"
                 th:if="${#fields.hasErrors('nombreProducto')}"
                 th:errors="*{nombreProducto}"></div>
        </div>

        <div class="campo">
            <label for="precio">Precio (Q)</label>
            <input type="number" step="0.01" id="precio" th:field="*{precio}" required>
            <div class="error"
                 th:if="${#fields.hasErrors('precio')}"
                 th:errors="*{precio}"></div>
        </div>

        <div class="campo">
            <label for="stock">Stock</label>
            <input type="number" id="stock" th:field="*{stock}" required>
            <div class="error"
                 th:if="${#fields.hasErrors('stock')}"
                 th:errors="*{stock}"></div>
        </div>

        <div class="campo">
            <label>Estado</label>
            <div class="opcion">
                <label for="activo">Activo</label>
                <input type="radio" id="activo" th:field="*{estado}" value="true" required>
            </div>

            <div class="opcion">
                <label for="inactivo">Inactivo</label>
                <input type="radio" id="inactivo" th:field="*{estado}" value="false" required>
            </div>

            <div class="error"
                 th:if="${#fields.hasErrors('estado')}"
                 th:errors="*{estado}"></div>
        </div>

        <div class="acciones">
            <button type="submit"
                    class="btn"
                    th:text="${modoEdicion} ? 'Actualizar' : 'Guardar'"></button>

            <a class="btn-cancelar" th:href="@{/producto}">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
