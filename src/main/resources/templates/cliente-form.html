<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modoEdicion} ? 'Editar Cliente' : 'Nuevo Cliente'"></title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1 th:text="${modoEdicion} ? 'Editar Cliente' : 'Nuevo Cliente'"></h1>

    <form th:action="${modoEdicion} ? @{/cliente/actualizar/{dpi}(dpi=${cliente.dpiCliente})} : @{/cliente/guardar}"
          th:object="${cliente}"
          method="post">
        
        <div class="campo">
            <label for="dpiCliente">DPI</label>
            <input type="number" id="dpiCliente" th:field="*{dpiCliente}" required>
            <div class="error"
                 th:if="${#fields.hasErrors('dpiCliente')}"
                 th:errors="*{dpiCliente}"></div>
        </div>
        
        <div class="campo">
            <label for="nombreCliente">Nombre</label>
            <input type="text" id="nombreCliente" th:field="*{nombreCliente}" required>
            <div class="error"
                 th:if="${#fields.hasErrors('nombreCliente')}"
                 th:errors="*{nombreCliente}"></div>
        </div>

        <div class="campo">
            <label for="apellidoCliente">Apellido</label>
            <input type="text" id="apellidoCliente" th:field="*{apellidoCliente}" required>
            <div class="error"
                 th:if="${#fields.hasErrors('apellidoCliente')}"
                 th:errors="*{apellidoCliente}"></div>
        </div>

        <div class="campo">
            <label for="direccion">Dirección</label>
            <input type="text" id="direccion" th:field="*{direccion}" required>
            <div class="error"
                 th:if="${#fields.hasErrors('direccion')}"
                 th:errors="*{direccion}"></div>
        </div>

        <div class="campo">
            <label>Estado</label>
            <div class="opcion">
                <label for="activo">Activo</label>
                <input type="radio" id="activo" th:field="*{estado}" value="true" required>
            </div>

            <div class="opcion">
                <label for="inactivo">Inactivo</label>
                <input type="radio" id="inactivo" th:field="*{estado}" value="false" required>
            </div>

            <div class="error"
                 th:if="${#fields.hasErrors('estado')}"
                 th:errors="*{estado}"></div>
        </div>

        <div class="acciones">
            <button type="submit"
                    class="btn"
                    th:text="${modoEdicion} ? 'Actualizar' : 'Guardar'"></button>

            <a class="btn-cancelar" th:href="@{/cliente}">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
