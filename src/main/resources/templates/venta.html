<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ventas</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Lista de Ventas</h1>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Total (Q)</th>
            <th>Estado</th>
            <th>DPI de Cliente</th>
            <th>ID de Usuario</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="venta : ${ventas}">
            <td th:text="${venta.codigoVenta}"></td>
            <td th:text="${venta.fechaVenta}"></td>
            <td th:text="${venta.total}"></td>
            <td th:text="${venta.estado} ? 'Activa' : 'Inactiva'"></td>
            <td th:text="${venta.clientesDpiCliente}"></td>
            <td th:text="${venta.usuariosCodigoUsuario}"></td>
            <td>
                <a class="btn-secundario" th:href="@{/venta/editar/{id}(id=${venta.codigoVenta})}">Editar</a>
                <a class="btn-cancelar" th:href="@{/venta/eliminar/{id}(id=${venta.codigoVenta})}">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="acciones">
        <a class="btn" th:href="@{/venta/nuevo}">Nueva</a>
        <a class="btn-secundario" th:href="@{/home}">Volver</a>
    </div>
</div>
</body>
</html>
