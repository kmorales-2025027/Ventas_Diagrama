<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modoEdicion} ? 'Editar Detalles de Pedido' : 'Nuevos Detalles de Pedido'"></title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1 th:text="${modoEdicion} ? 'Editar Detalles del Pedido' : 'Nuevos Detalles del Pedido'"></h1>

    <form th:action="${modoEdicion} ? @{/detalle/actualizar/{id}(id=${detalle.codigoDetalleVenta})} : @{/detalle/guardar}"
          th:object="${detalle}"
          method="post">

        <div class="campo">
            <label for="cantidad">Cantidad</label>
            <input type="number" id="cantidad" th:field="*{cantidad}" required>
            <div class="error"
                 th:if="${#fields.hasErrors('cantidad')}"
                 th:errors="*{cantidad}"></div>
        </div>

        <div class="campo">
            <label for="precioUnitario">Precio Unitario (Q)</label>
            <input type="number" step="0.01" id="precioUnitario" th:field="*{precioUnitario}" required>
            <div class="error"
                 th:if="${#fields.hasErrors('precioUnitario')}"
                 th:errors="*{precioUnitario}"></div>
        </div>

        <div class="campo">
            <label for="subtotal">Subtotal (Q)</label>
            <input type="number" step="0.01" id="subtotal" th:field="*{subtotal}" required>
            <div class="error"
                 th:if="${#fields.hasErrors('subtotal')}"
                 th:errors="*{subtotal}"></div>
        </div>

        <div class="campo">
            <label for="productosCodigoProducto">ID de Producto</label>
            <input type="number" id="productosCodigoProducto" th:field="*{productosCodigoProducto}" required>
            <div class="error"
                 th:if="${#fields.hasErrors('productosCodigoProducto')}"
                 th:errors="*{productosCodigoProducto}"></div>
        </div>

        <div class="campo">
            <label for="ventasCodigoVenta">ID de Venta</label>
            <input type="number" id="ventasCodigoVenta" th:field="*{ventasCodigoVenta}" required>
            <div class="error"
                 th:if="${#fields.hasErrors('ventasCodigoVenta')}"
                 th:errors="*{ventasCodigoVenta}"></div>
        </div>

        <div class="acciones">
            <button type="submit"
                    class="btn"
                    th:text="${modoEdicion} ? 'Actualizar' : 'Guardar'"></button>

            <a class="btn-cancelar" th:href="@{/detalle}">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
