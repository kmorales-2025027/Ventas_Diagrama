<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modoEdicion} ? 'Editar Usuario' : 'Nuevo Usuario'"></title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1 th:text="${modoEdicion} ? 'Editar Usuario' : 'Nuevo Usuario'"></h1>

    <form th:action="${modoEdicion} ? @{/usuario/actualizar/{id}(id=${usuario.codigoUsuario})} : @{/usuario/guardar}"
          th:object="${usuario}"
          method="post">

        <div class="campo">
            <label for="username">Username</label>
            <input type="text" id="username" th:field="*{username}" required>
            <div class="error"
                 th:if="${#fields.hasErrors('username')}"
                 th:errors="*{username}"></div>
        </div>

        <div class="campo">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" required>
            <div class="error"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}"></div>
        </div>

        <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" th:field="*{password}" required>
            <div class="error"
                 th:if="${#fields.hasErrors('password')}"
                 th:errors="*{password}"></div>
        </div>

        <div class="campo">
            <label>Rol</label>
            <div class="opcion">
                <label for="USER">USER</label>
                <input type="radio" id="USER" th:field="*{rol}" value="USER" required>
            </div>

            <div class="opcion">
                <label for="ADMIN">ADMIN</label>
                <input type="radio" id="ADMIN" th:field="*{rol}" value="ADMIN" required>
            </div>

            <div class="error"
                 th:if="${#fields.hasErrors('rol')}"
                 th:errors="*{rol}"></div>
        </div>

        <div class="campo">
            <label>Estado</label>
            <div class="opcion">
                <label for="activo">Activo</label>
                <input type="radio" id="activo" th:field="*{estado}" value="true" required>
            </div>

            <div class="opcion">
                <label for="inactivo">Inactivo</label>
                <input type="radio" id="inactivo" th:field="*{estado}" value="false" required>
            </div>

            <div class="error"
                 th:if="${#fields.hasErrors('estado')}"
                 th:errors="*{estado}"></div>
        </div>

        <div class="acciones">
            <button type="submit"
                    class="btn"
                    th:text="${modoEdicion} ? 'Actualizar' : 'Guardar'"></button>

            <a class="btn-cancelar" th:href="@{/usuario}">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
