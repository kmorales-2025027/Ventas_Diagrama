<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modoEdicion} ? 'Editar Venta' : 'Nueva Venta'"></title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1 th:text="${modoEdicion} ? 'Editar Venta' : 'Nueva Venta'"></h1>

    <form th:action="${modoEdicion} ? @{/venta/actualizar/{id}(id=${venta.codigoVenta})} : @{/venta/guardar}"
          th:object="${venta}"
          method="post">

        <div class="campo">
            <label for="fechaVenta">Fecha</label>
            <input type="date" id="fechaVenta" th:field="*{fechaVenta}" required>
            <div class="error"
                 th:if="${#fields.hasErrors('fechaVenta')}"
                 th:errors="*{fechaVenta}"></div>
        </div>

        <div class="campo">
            <label for="total">Total (Q)</label>
            <input type="number" step="0.01" id="total" th:field="*{total}" required>
            <div class="error"
                 th:if="${#fields.hasErrors('total')}"
                 th:errors="*{total}"></div>
        </div>

        <div class="campo">
            <label>Estado</label>
            <div class="opcion">
                <label for="activo">Activo</label>
                <input type="radio" id="activo" th:field="*{estado}" value="true" required>
            </div>

            <div class="opcion">
                <label for="inactivo">Inactivo</label>
                <input type="radio" id="inactivo" th:field="*{estado}" value="false" required>
            </div>

            <div class="error"
                 th:if="${#fields.hasErrors('estado')}"
                 th:errors="*{estado}"></div>
        </div>

        <div class="campo">
            <label for="clientesDpiCliente">DPI de Cliente</label>
            <input type="number" id="clientesDpiCliente" th:field="*{clientesDpiCliente}" required>
            <div class="error"
                 th:if="${#fields.hasErrors('clientesDpiCliente')}"
                 th:errors="*{clientesDpiCliente}"></div>
        </div>

        <div class="campo">
            <label for="usuariosCodigoUsuario">ID de Usuario</label>
            <input type="number" id="usuariosCodigoUsuario" th:field="*{usuariosCodigoUsuario}" required>
            <div class="error"
                 th:if="${#fields.hasErrors('usuariosCodigoUsuario')}"
                 th:errors="*{usuariosCodigoUsuario}"></div>
        </div>

        <div class="acciones">
            <button type="submit"
                    class="btn"
                    th:text="${modoEdicion} ? 'Actualizar' : 'Guardar'"></button>

            <a class="btn-cancelar" th:href="@{/venta}">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
