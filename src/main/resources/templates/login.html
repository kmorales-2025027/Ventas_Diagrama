<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Iniciar Sesión</h1>
    <p class="subtitulo">Ingrese sus credenciales</p>

    <div class="info" th:if="${param.registered}">
        Usuario registrado correctamente
    </div>

    <div class="error" th:if="${param.error}">
        Usuario o contraseña incorrectos
    </div>

    <form th:action="@{/login}" method="post">
        <div class="campo">
            <label for="username">Nombre de usuario / Correo electrónico</label>
            <input type="text" id="username" name="username" placeholder="Ingrese su usuario o correo" required>
        </div>

        <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>
        </div>

        <div class="acciones">
            <button class="btn" type="submit">Ingresar</button>

            <a class="btn-secundario" th:href="@{/register}">Registrarse</a>
        </div>
    </form>
</div>
</body>
</html>
